<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard — TDS Hub</title>
  <style>
    :root {
      --primary: #0366d6;
      --primary-dark: #0250a3;
      --danger: #d73a49;
      --danger-dark: #b02735;
      --bg: #0d1117;
      --panel-bg: #161b22;
      --border: rgba(255,255,255,.08);
      --text: #e6edf3;
      --text-muted: #8b949e;
    }
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: system-ui, -apple-system, sans-serif; 
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      background-attachment: fixed;
      color: var(--text); 
      min-height: 100vh;
    }

    /* ===== FLOATING TOAST MESSAGES ===== */
    .msg { 
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 1rem 2rem; 
      border-radius: 30px; 
      font-weight: 600;
      font-size: 1.05rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .msg.ok { background: #238636; color: white; border: 1px solid #2ea043; }
    .msg.err { background: #da3633; color: white; border: 1px solid #f85149; }

    /* ===== HEADER ===== */
    header {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    header h1 { margin: 0; font-size: 1.4rem; display: flex; align-items: center; gap: .5rem; color: #fff; }
    header nav { display: flex; gap: .5rem; }
    header nav a, header button {
      color: #c9d1d9; background: transparent; text-decoration: none;
      padding: .45rem 1rem; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
      font-size: .9rem; font-weight: 500; cursor: pointer;
      transition: all .2s ease;
    }
    header nav a:hover, header button:hover {
      background: rgba(88,166,255,.15);
      border-color: #58a6ff;
      color: #fff;
      transform: translateY(-1px);
    }

    /* ===== LOGIN BOX ===== */
    .login-box {
      max-width: 420px; margin: 6rem auto; background: var(--panel-bg);
      padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
      border: 1px solid var(--border); text-align: center;
    }
    .login-box h2 { margin-top: 0; color: #fff; }
    .login-box .lock { font-size: 3rem; margin-bottom: .5rem; }
    .login-box input {
      width: 100%; padding: .75rem 1rem; margin: 1rem 0;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 1rem; background: var(--bg); color: white;
      transition: all .2s;
    }
    .login-box input:focus { outline: none; border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
    
    /* ===== BUTTONS ===== */
    button {
      background: var(--primary); color: white; border: none;
      padding: .6rem 1.1rem; border-radius: 6px; cursor: pointer;
      font-size: .95rem; font-weight: 500; transition: all .15s;
      display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
    }
    button:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    button.btn-danger { background: var(--danger); }
    button.btn-danger:hover:not(:disabled) { background: var(--danger-dark); }
    button.btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid var(--border); }
    button.btn-secondary:hover:not(:disabled) { background: #30363d; color: #fff; }
    button.btn-success { background: #238636; }
    button.btn-success:hover:not(:disabled) { background: #2ea043; }
    button.btn-small { padding: .3rem .7rem; font-size: .82rem; }

    /* ===== WRAPPER & PANELS ===== */
    .admin-wrap { max-width: 1100px; margin: 2rem auto; padding: 0 1rem 4rem; }
    .panel {
      background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      animation: fadeUp .4s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .panel h2 {
      margin: 0 0 1rem; font-size: 1.15rem;
      display: flex; align-items: center; gap: .5rem;
      border-bottom: 1px solid var(--border); padding-bottom: .75rem; color: #fff;
    }
    .panel h2 .count {
      margin-left: auto; background: var(--bg);
      padding: .15rem .6rem; border-radius: 20px;
      font-size: .8rem; font-weight: normal; color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* ===== FORMS & INPUTS ===== */
    .row { display: flex; gap: .5rem; align-items: stretch; flex-wrap: wrap; margin-bottom: .75rem; }
    .row input, .row select, .row textarea {
      padding: .6rem .8rem; border: 1px solid var(--border);
      border-radius: 6px; font-family: inherit; font-size: .95rem;
      background: var(--bg); color: white; transition: all .2s;
    }
    .row input:focus, .row select:focus, .row textarea:focus {
      outline: none; border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,.15);
    }
    .row input, .row select { flex: 1; min-width: 130px; }
    .row textarea { flex: 1 1 100%; font-family: ui-monospace, monospace; font-size: .9rem; resize: vertical; }
    
    /* Specific heights for different textareas */
    #q-title { min-height: 60px; }
    #edit-theory, #edit-conclusion { min-height: 120px; }

    /* ===== ITEMS / LISTS ===== */
    .item {
      display: flex; align-items: center; gap: .75rem;
      padding: .75rem 1rem; margin: .5rem 0;
      background: var(--bg); border-left: 3px solid #58a6ff;
      border-radius: 6px; transition: all .2s ease;
      border: 1px solid var(--border); border-left-width: 3px;
    }
    .item:hover { background: #1c2128; transform: translateX(4px); border-color: #58a6ff; box-shadow: 0 4px 12px rgba(88,166,255,.1); }
    .item.is-project { border-left-color: #f59e0b; }
    .item.is-project:hover { border-color: #f59e0b; box-shadow: 0 4px 12px rgba(245,158,11,.1); }
    
    .item .item-info { flex: 1; min-width: 0; }
    .item .item-title { font-weight: 600; margin-bottom: .15rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .item-sub { font-size: .82rem; color: var(--text-muted); display: flex; align-items: center; gap: .5rem; }
    .item .item-actions { display: flex; gap: .4rem; flex-shrink: 0; }

    /* ===== BADGES & HELPERS ===== */
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 12px; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .3px;}
    .badge-week { background: rgba(3,102,214,.15); color: #58a6ff; }
    .badge-project { background: rgba(245,158,11,.15); color: #f59e0b; }
    
    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-style: italic; border: 2px dashed var(--border); border-radius: 8px; background: rgba(255,255,255,.02); }
    .helper-text { font-size: .85rem; color: var(--text-muted); margin-bottom: 1rem; }

    .hidden { display: none !important; }
    
    /* ===== SPINNER ===== */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      header { flex-direction: column; gap: 1rem; padding: 1rem; }
      .row { flex-direction: column; }
      .item { flex-direction: column; align-items: stretch; }
      .item .item-actions { justify-content: flex-end; margin-top: .5rem; }
    }
  </style>
</head>
<body>
  <!-- Floating Toast Notification -->
  <div id="msg" class="msg"></div>

  <header>
    <h1>🛠️ Admin Dashboard</h1>
    <nav>
      <a href="/">🏠 Home</a>
      <button id="logout-btn" class="hidden" onclick="logout()">🚪 Logout</button>
    </nav>
  </header>

  <!-- Login Screen -->
  <div id="login-screen" class="login-box">
    <div class="lock">🔒</div>
    <h2>Admin Access</h2>
    <p style="color:#8b949e; font-size:.9rem;">Enter your admin key to manage content.</p>
    <input id="admin-key-input" type="password" placeholder="Admin key" autocomplete="off" autofocus>
    <button onclick="login(this)" id="login-btn" style="width: 100%;">🔓 Login</button>
    <p id="login-error" style="color:#f85149; display:none; margin-top:1rem;">Invalid key. Try again.</p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="admin-wrap hidden">
    
    <!-- Weeks Panel -->
    <div class="panel">
      <h2>📅 Weeks & Projects <span class="count" id="week-count">0</span></h2>
      <div class="row">
        <input id="week-name" placeholder="Week name (e.g. Week 1)" onkeydown="if(event.key==='Enter')createWeek()">
        <input id="week-order" type="number" placeholder="Order" style="max-width:110px;">
        <select id="week-project" style="max-width:130px;">
          <option value="false">📅 Week</option>
          <option value="true">📦 Project</option>
        </select>
        <button onclick="createWeek(this)" id="add-week-btn">➕ Add</button>
      </div>
      <div id="week-list" style="margin-top:1rem;"></div>
    </div>

    <!-- Questions Panel -->
    <div class="panel">
      <h2>❓ Questions <span class="count" id="question-count">0</span></h2>
      
      <p class="helper-text">Select a week or project below to view its questions and add new ones.</p>
      <div class="row">
        <select id="q-week" onchange="loadQuestions()" style="max-width:400px;">
          <option value="">-- Select a Week to manage questions --</option>
        </select>
      </div>

      <div id="add-q-wrapper" class="hidden" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
        <div class="row">
          <!-- Changed to Textarea for long questions -->
          <textarea id="q-title" placeholder="Paste or type the full question text here..." rows="3"></textarea>
        </div>
        <div class="row">
          <input id="q-order" type="number" placeholder="Order (optional)" style="max-width:150px;">
          <button onclick="createQuestion(this)" id="add-q-btn">➕ Add Question</button>
        </div>
      </div>

      <div id="question-list" style="margin-top:1rem;"></div>
    </div>

    <!-- Theory Editor Panel -->
    <div class="panel">
      <h2>📖 Edit Theory & Conclusion</h2>
      <div class="row">
        <select id="edit-q-select" onchange="loadQuestionForEdit()" style="max-width:400px;">
          <option value="">-- Select a question --</option>
        </select>
      </div>
      <div id="edit-area" class="hidden" style="margin-top:1rem;">
        <div class="row">
          <textarea id="edit-title" placeholder="Question title" style="min-height: 60px;"></textarea>
        </div>
        <div class="row">
          <textarea id="edit-theory" placeholder="Full prerequisite theory..."></textarea>
        </div>
        <div class="row">
          <textarea id="edit-conclusion" placeholder="Conclusion / takeaways..."></textarea>
        </div>
        <div class="row">
          <button onclick="saveQuestionEdit(this)" class="btn-success" id="save-edit-btn">💾 Save Changes</button>
          <button onclick="loadQuestionForEdit()" class="btn-secondary">↺ Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ADMIN_KEY = sessionStorage.getItem('admin_key') || '';
    let allWeeks = [];

    const $ = id => document.getElementById(id);

    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Floating Pop-up Message
    function showMsg(text, ok = true) {
      const el = $('msg');
      el.textContent = text;
      el.className = 'msg show ' + (ok ? 'ok' : 'err');
      
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { 
        el.classList.remove('show'); 
      }, 3000); 
    }

    function setLoading(btn, loading) {
      if (!btn) return;
      if (loading) {
        btn._original = btn.innerHTML;
        btn.innerHTML = '<span class="spinner"></span> Working...';
        btn.disabled = true;
      } else {
        btn.innerHTML = btn._original || btn.innerHTML;
        btn.disabled = false;
      }
    }

    async function api(path, opts = {}) {
      opts.headers = opts.headers || {};
      opts.headers['X-Admin-Key'] = ADMIN_KEY;
      if (opts.body && typeof opts.body !== 'string') {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      const res = await fetch(path, opts);
      if (res.status === 403) {
        logout();
        throw new Error('Unauthorized');
      }
      return res;
    }

    async function login(btn) {
      const key = $('admin-key-input').value.trim();
      if (!key) return;
      setLoading(btn, true);
      try {
        const res = await fetch('/api/admin/verify', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({key})
        });
        if (res.ok) {
          ADMIN_KEY = key;
          sessionStorage.setItem('admin_key', key);
          $('login-error').style.display = 'none';
          await enterDashboard();
        } else {
          $('login-error').style.display = 'block';
        }
      } finally {
        setLoading(btn, false);
      }
    }

    function logout() {
      sessionStorage.removeItem('admin_key');
      ADMIN_KEY = '';
      $('dashboard').classList.add('hidden');
      $('login-screen').classList.remove('hidden');
      $('logout-btn').classList.add('hidden');
      $('admin-key-input').value = '';
    }

    async function enterDashboard() {
      $('login-screen').classList.add('hidden');
      $('dashboard').classList.remove('hidden');
      $('logout-btn').classList.remove('hidden');
      await loadWeeks();
    }

    async function loadWeeks() {
      const res = await fetch('/api/weeks');
      allWeeks = await res.json();
      $('week-count').textContent = allWeeks.length;

      const list = $('week-list');
      list.innerHTML = '';
      if (!allWeeks.length) {
        list.innerHTML = '<div class="empty-state">No weeks yet. Add your first one above 👆</div>';
      } else {
        allWeeks.forEach(w => {
          const div = document.createElement('div');
          div.className = 'item' + (w.is_project ? ' is-project' : '');
          div.innerHTML = `
            <div class="item-info">
              <div class="item-title">${w.is_project ? '📦' : '📅'} ${escapeHtml(w.name)}</div>
              <div class="item-sub">
                <span class="badge ${w.is_project ? 'badge-project' : 'badge-week'}">${w.is_project ? 'Project' : 'Week'}</span>
                ${w.question_count} question${w.question_count === 1 ? '' : 's'}
              </div>
            </div>
            <div class="item-actions">
              <button class="btn-danger btn-small" onclick="deleteWeek(${w.id}, this)">🗑️ Delete</button>
            </div>`;
          list.appendChild(div);
        });
      }

      // Update the dropdown
      const opts = '<option value="">-- Select a Week to manage questions --</option>' + 
        allWeeks.map(w => `<option value="${w.id}">${w.is_project ? '📦' : '📅'} ${escapeHtml(w.name)}</option>`).join('');
      $('q-week').innerHTML = opts;
      
      const currentVal = $('q-week').value;
      if (currentVal) {
        $('q-week').value = currentVal;
        await loadQuestions();
      } else {
        $('add-q-wrapper').classList.add('hidden');
        $('question-list').innerHTML = '';
      }
    }

    async function createWeek(btn) {
      const name = $('week-name').value.trim();
      const order = parseInt($('week-order').value) || 0;
      const is_project = $('week-project').value === 'true';
      if (!name) return showMsg('Name required', false);
      setLoading(btn, true);
      try {
        const res = await api('/api/admin/week', { method: 'POST', body: {name, order, is_project} });
        if (res.ok) {
          $('week-name').value = '';
          $('week-order').value = '';
          showMsg(`✅ ${is_project ? 'Project' : 'Week'} "${name}" created`);
          await loadWeeks();
        } else showMsg('Failed to create', false);
      } finally {
        setLoading(btn, false);
      }
    }

    async function deleteWeek(id, btn) {
      const w = allWeeks.find(x => x.id === id);
      if (!confirm(`Delete "${w?.name}" and all its questions?`)) return;
      setLoading(btn, true);
      try {
        const res = await api('/api/admin/week/' + id, {method: 'DELETE'});
        if (res.ok) { showMsg('🗑️ Deleted'); await loadWeeks(); }
        else showMsg('Delete failed', false);
      } finally {
        setLoading(btn, false);
      }
    }

    async function loadQuestions() {
      const weekId = parseInt($('q-week').value);
      const list = $('question-list');
      
      if (!weekId) {
        $('add-q-wrapper').classList.add('hidden');
        list.innerHTML = '';
        $('question-count').textContent = '0';
        $('edit-q-select').innerHTML = '<option value="">-- Select a question --</option>';
        return;
      }

      $('add-q-wrapper').classList.remove('hidden');

      const res = await fetch('/api/weeks/' + weekId);
      const data = await res.json();
      $('question-count').textContent = data.questions.length;

      list.innerHTML = '';
      if (!data.questions.length) {
        list.innerHTML = '<div class="empty-state">No questions in this week yet. Add one above 👆</div>';
      } else {
        data.questions.forEach((q, i) => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <div class="item-info">
              <div class="item-title" title="${escapeHtml(q.title)}">${i + 1}. ${escapeHtml(q.title)}</div>
            </div>
            <div class="item-actions">
              <a href="/question/${q.id}" target="_blank" style="background:var(--panel-bg);color:white;border:1px solid var(--border);text-decoration:none;padding:.3rem .7rem;border-radius:6px;font-size:.82rem;">👁️ View</a>
              <button class="btn-danger btn-small" onclick="deleteQuestion(${q.id}, this)">🗑️</button>
            </div>`;
          list.appendChild(div);
        });
      }
      await populateEditSelect();
    }

    async function populateEditSelect() {
      const opts = [];
      for (const w of allWeeks) {
        const r = await fetch('/api/weeks/' + w.id);
        const d = await r.json();
        d.questions.forEach(q => {
          // Truncate long titles in the dropdown for readability
          const shortTitle = q.title.length > 50 ? q.title.substring(0, 50) + '...' : q.title;
          opts.push(`<option value="${q.id}">${w.is_project ? '📦' : '📅'} ${escapeHtml(w.name)} → ${escapeHtml(shortTitle)}</option>`);
        });
      }
      $('edit-q-select').innerHTML = '<option value="">-- Select a question --</option>' + opts.join('');
    }

    async function createQuestion(btn) {
      const weekId = parseInt($('q-week').value);
      const title = $('q-title').value.trim();
      const order = parseInt($('q-order').value) || 0;
      
      if (!weekId) return showMsg('Select a week first', false);
      if (!title) return showMsg('Question text required', false);
      
      setLoading(btn, true);
      try {
        const res = await api('/api/admin/question', { method: 'POST', body: {week_id: weekId, title, order} });
        if (res.ok) {
          $('q-title').value = '';
          $('q-order').value = '';
          showMsg(`✅ Question added successfully!`);
          await loadQuestions();
        } else showMsg('Failed to create. Is the database column Text?', false);
      } finally {
        setLoading(btn, false);
      }
    }

    async function deleteQuestion(qid, btn) {
      if (!confirm('Delete this question?')) return;
      setLoading(btn, true);
      try {
        const res = await api('/api/admin/question/' + qid, {method: 'DELETE'});
        if (res.ok) { showMsg('🗑️ Question deleted'); await loadQuestions(); }
        else showMsg('Delete failed', false);
      } finally {
        setLoading(btn, false);
      }
    }

    async function loadQuestionForEdit() {
      const qid = $('edit-q-select').value;
      if (!qid) { $('edit-area').classList.add('hidden'); return; }
      const res = await fetch('/api/questions/' + qid);
      const q = await res.json();
      $('edit-area').classList.remove('hidden');
      $('edit-title').value = q.title;
      $('edit-theory').value = q.full_theory || '';
      $('edit-conclusion').value = q.conclusion || '';
    }

    async function saveQuestionEdit(btn) {
      const qid = $('edit-q-select').value;
      if (!qid) return;
      setLoading(btn, true);
      try {
        const res = await api('/api/admin/question/' + qid, {
          method: 'PUT',
          body: {
            title: $('edit-title').value,
            full_theory: $('edit-theory').value,
            conclusion: $('edit-conclusion').value
          }
        });
        if (res.ok) showMsg('💾 Saved successfully');
        else showMsg('Save failed', false);
      } finally {
        setLoading(btn, false);
      }
    }

    if (ADMIN_KEY) enterDashboard();
  </script>
</body>
</html>
