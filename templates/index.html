<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDS Assignment Hub</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>⚙️ TDS Hub</h1>
    <nav>
      <a href="/">🏠 Home</a>
      <a href="/admin">🛠️ Admin</a>
    </nav>
  </header>
  <main>
    <h2>Weeks</h2>
    <div id="week-list" class="week-grid"></div>

    <h2>Projects</h2>
    <div id="project-list" class="week-grid"></div>
  </main>
  <script>
    fetch('/api/weeks').then(r => r.json()).then(weeks => {
      const wk = document.getElementById('week-list');
      const pr = document.getElementById('project-list');
      
      if (!weeks.length) {
        wk.innerHTML = '<p style="color:#8b949e">No weeks added yet.</p>';
        return;
      }

      weeks.forEach(w => {
        const div = document.createElement('a');
        div.href = '/week/' + w.id;
        div.className = 'week-card' + (w.is_project ? ' is-project' : '');
        
        // Extract number for icon (e.g., "Week 4" -> "4", "Project 1" -> "P1")
        let iconText = '⚙️';
        if (w.name.toLowerCase().includes('week')) {
          const num = w.name.match(/\d+/);
          if (num) iconText = num[0];
        } else if (w.name.toLowerCase().includes('project')) {
          const num = w.name.match(/\d+/);
          iconText = num ? 'P' + num[0] : '📦';
        }

        div.innerHTML = `
          <div class="week-gear-icon">${iconText}</div>
          <div class="week-title">${w.name}</div>
          <div class="week-subtitle">${w.question_count} Questions</div>
        `;
        (w.is_project ? pr : wk).appendChild(div);
      });
    });
  </script>
</body>
</html>
