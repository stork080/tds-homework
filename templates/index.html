<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TDS Assignment Hub</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>📚 TDS Assignment Hub</h1></header>
  <main>
    <h2>Weeks</h2>
    <ul id="week-list" class="card-list"></ul>
    <h2>Projects</h2>
    <ul id="project-list" class="card-list"></ul>
  </main>
  <script>
    fetch('/api/weeks').then(r => r.json()).then(weeks => {
      const wk = document.getElementById('week-list');
      const pr = document.getElementById('project-list');
      weeks.forEach(w => {
        const li = document.createElement('li');
        li.className = 'card';
        li.innerHTML = `<a href="/week/${w.id}"><strong>${w.name}</strong><br><small>${w.question_count} questions</small></a>`;
        (w.is_project ? pr : wk).appendChild(li);
      });
    });
  </script>
</body>
</html>
