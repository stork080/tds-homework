<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDS Assignment Hub</title>
  <style>
    :root { --primary: #0366d6; --bg: #0d1117; --panel-bg: #161b22; --border: rgba(255,255,255,.08); --text: #e6edf3; --text-muted: #8b949e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%); background-attachment: fixed; color: var(--text); min-height: 100vh; }
    header { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    header h1 { margin: 0; font-size: 1.4rem; color: #fff; }
    
    /* Search Bar */
    .search-container { flex: 1; max-width: 400px; margin: 0 2rem; position: relative; }
    .search-container input { width: 100%; padding: .6rem 1rem .6rem 2.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; color: white; font-size: .9rem; transition: all .2s; }
    .search-container input:focus { outline: none; border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    
    header nav a { color: #c9d1d9; text-decoration: none; padding: .45rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); font-size: .9rem; transition: all .2s; }
    header nav a:hover { background: rgba(88,166,255,.15); border-color: #58a6ff; color: #fff; }
    
    .admin-wrap { max-width: 1100px; margin: 2rem auto; padding: 0 1rem 4rem; }
    .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
    .panel h2 { margin: 0 0 1rem; font-size: 1.15rem; display: flex; align-items: center; gap: .5rem; border-bottom: 1px solid var(--border); padding-bottom: .75rem; color: #fff; }
    .panel h2 .count { margin-left: auto; background: var(--bg); padding: .15rem .6rem; border-radius: 20px; font-size: .8rem; color: var(--text-muted); border: 1px solid var(--border); }
    
    #week-list, #project-list { display: flex; flex-direction: column; gap: .5rem; }
    .item { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; background: var(--bg); border-left: 4px solid var(--primary); border-radius: 8px; transition: all .2s; cursor: pointer; border: 1px solid var(--border); border-left-width: 4px; text-decoration: none; color: inherit; }
    .item:hover { background: #1c2128; transform: translateX(4px); border-color: #58a6ff; box-shadow: 0 4px 12px rgba(88,166,255,.1); }
    .item.is-project { border-left-color: #f59e0b; }
    .item.is-project:hover { border-color: #f59e0b; box-shadow: 0 4px 12px rgba(245,158,11,.1); }
    .gear-icon { width: 50px; height: 50px; background: #21262d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; color: #58a6ff; flex-shrink: 0; transition: all .3s; }
    .item.is-project .gear-icon { color: #f59e0b; }
    .item:hover .gear-icon { transform: scale(1.15) rotate(10deg); background: #2d333b; }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-weight: 600; font-size: 1.05rem; color: #fff; }
    .item-sub { font-size: .82rem; color: var(--text-muted); display: flex; align-items: center; gap: .5rem; margin-top: .2rem; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 12px; font-size: .75rem; font-weight: 600; }
    .badge-week { background: rgba(3,102,214,.15); color: #58a6ff; }
    .badge-project { background: rgba(245,158,11,.15); color: #f59e0b; }
    
    .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); font-style: italic; border: 2px dashed var(--border); border-radius: 8px; }
    
    @media (max-width: 768px) {
      header { flex-direction: column; gap: 1rem; padding: 1rem; }
      .search-container { margin: 0; width: 100%; max-width: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 TDS Hub</h1>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="global-search" placeholder="Search questions or weeks..." onkeyup="searchApp()">
    </div>
    <nav><a href="/admin">🛠️ Admin</a></nav>
  </header>

  <div class="admin-wrap">
    <div class="panel" id="search-results-panel" style="display:none;">
      <h2>🔍 Search Results</h2>
      <div id="search-results"></div>
    </div>

    <div class="panel" id="main-weeks-panel">
      <h2>📅 Weeks <span class="count" id="week-count">0</span></h2>
      <div id="week-list"><div class="empty-state">Loading...</div></div>
    </div>

    <div class="panel" id="main-projects-panel">
      <h2>📦 Projects <span class="count" id="project-count">0</span></h2>
      <div id="project-list"><div class="empty-state">Loading...</div></div>
    </div>
  </div>

  <script>
    let allWeeksData = [];
    let allQuestionsData = []; // Flat list for search

    function escapeHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function loadData() {
      const res = await fetch('/api/weeks');
      allWeeksData = await res.json();
      
      // Fetch all questions for search
      for (let w of allWeeksData) {
        const qRes = await fetch('/api/weeks/' + w.id);
        const qData = await qRes.json();
        qData.questions.forEach(q => {
          allQuestionsData.push({ ...q, weekName: w.name, weekId: w.id, isProject: w.is_project });
        });
      }
      renderHome();
    }

    function renderHome() {
      const wkList = document.getElementById('week-list');
      const prList = document.getElementById('project-list');
      const weeksArr = allWeeksData.filter(w => !w.is_project);
      const projsArr = allWeeksData.filter(w => w.is_project);

      document.getElementById('week-count').textContent = weeksArr.length;
      document.getElementById('project-count').textContent = projsArr.length;

      function renderItems(arr, container, isProject) {
        container.innerHTML = '';
        if (!arr.length) return container.innerHTML = `<div class="empty-state">No ${isProject ? 'projects' : 'weeks'} yet.</div>`;
        arr.forEach(w => {
          const numMatch = w.name.match(/\d+/);
          const iconText = numMatch ? (isProject ? 'P' + numMatch[0] : numMatch[0]) : (isProject ? '📦' : '⚙️');
          const a = document.createElement('a');
          a.href = '/week/' + w.id;
          a.className = 'item' + (isProject ? ' is-project' : '');
          a.innerHTML = `
            <div class="gear-icon">${iconText}</div>
            <div class="item-info">
              <div class="item-title">${escapeHtml(w.name)}</div>
              <div class="item-sub"><span class="badge ${isProject ? 'badge-project' : 'badge-week'}">${isProject ? 'Project' : 'Week'}</span> ${w.question_count} questions</div>
            </div>`;
          container.appendChild(a);
        });
      }
      renderItems(weeksArr, wkList, false);
      renderItems(projsArr, prList, true);
    }

    function searchApp() {
      const query = document.getElementById('global-search').value.toLowerCase().trim();
      const resultsPanel = document.getElementById('search-results-panel');
      const mainWeeks = document.getElementById('main-weeks-panel');
      const mainProjects = document.getElementById('main-projects-panel');

      if (!query) {
        resultsPanel.style.display = 'none';
        mainWeeks.style.display = 'block';
        mainProjects.style.display = 'block';
        return;
      }

      mainWeeks.style.display = 'none';
      mainProjects.style.display = 'none';
      resultsPanel.style.display = 'block';

      const matches = allQuestionsData.filter(q => 
        q.title.toLowerCase().includes(query) || q.weekName.toLowerCase().includes(query)
      );

      const container = document.getElementById('search-results');
      container.innerHTML = '';
      if (!matches.length) {
        container.innerHTML = '<div class="empty-state">No questions found matching your search.</div>';
        return;
      }

      matches.forEach(q => {
        const a = document.createElement('a');
        a.href = '/question/' + q.id;
        a.className = 'item';
        a.innerHTML = `
          <div class="item-info">
            <div class="item-title">${escapeHtml(q.title)}</div>
            <div class="item-sub">Found in: ${escapeHtml(q.weekName)}</div>
          </div>`;
        container.appendChild(a);
      });
    }

    loadData();
  </script>
</body>
</html>
