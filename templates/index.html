<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDS Assignment Hub</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>📚 TDS Assignment Hub</h1>
    <nav>
      <a href="/">🏠 Home</a>
      <a href="/admin">🛠️ Admin</a>
    </nav>
  </header>
  <main>
    <h2>📅 Weeks</h2>
    <ul id="week-list" class="card-list"></ul>
    <h2>📦 Projects</h2>
    <ul id="project-list" class="card-list"></ul>
  </main>
  <script>
    fetch('/api/weeks').then(r => r.json()).then(weeks => {
      const wk = document.getElementById('week-list');
      const pr = document.getElementById('project-list');
      const weeksArr = weeks.filter(w => !w.is_project);
      const projsArr = weeks.filter(w => w.is_project);
      if (!weeksArr.length) wk.innerHTML = '<li class="empty">No weeks yet.</li>';
      if (!projsArr.length) pr.innerHTML = '<li class="empty">No projects yet.</li>';
      weeksArr.forEach(w => {
        const li = document.createElement('li');
        li.className = 'card';
        li.innerHTML = `<a href="/week/${w.id}"><strong>📅 ${w.name}</strong><br><small>${w.question_count} question${w.question_count===1?'':'s'}</small></a>`;
        wk.appendChild(li);
      });
      projsArr.forEach(w => {
        const li = document.createElement('li');
        li.className = 'card project';
        li.innerHTML = `<a href="/week/${w.id}"><strong>📦 ${w.name}</strong><br><small>${w.question_count} question${w.question_count===1?'':'s'}</small></a>`;
        pr.appendChild(li);
      });
    });
  </script>
</body>
</html>
