<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question — TDS Hub</title>
  <!-- Prism.js for Syntax Highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <style>
    /* [Keep all your existing CSS here from the previous question.html] */
    /* ... Paste the :root, body, header, .q-header-box, .tabs, .tab-panel, .section-title, .theory-box, inputs, buttons CSS ... */
    
    /* NEW STYLES */
    .sort-bar { display: flex; justify-content: flex-end; margin-bottom: 1rem; gap: .5rem; }
    .sort-bar select { padding: .4rem .8rem; background: var(--bg); color: white; border: 1px solid var(--border); border-radius: 6px; }
    
    .sol-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .75rem; }
    .author-info { display: flex; align-items: center; gap: .5rem; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: .8rem; background: #58a6ff; }
    .flag-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: .2rem; transition: color .2s; }
    .flag-btn:hover { color: #f85149; }
    
    /* Code block styling */
    .sol-content pre { margin: 0; border-radius: 8px; }
    .copy-btn { background: #21262d; color: #c9d1d9; border: 1px solid var(--border); padding: .3rem .6rem; border-radius: 4px; font-size: .75rem; cursor: pointer; margin-top: .5rem; }
    .copy-btn:hover { background: #30363d; }
  </style>
</head>
<body>
  <!-- [Keep the Header and Main container here] -->
  <!-- ... Paste the header, q-header-box, and tabs here ... -->

    <!-- Tab 1: Steps -->
    <section id="tab-steps" class="tab-panel">
      <div class="sort-bar">
        <select id="sort-steps" onchange="loadSolutions('steps')">
          <option value="top">🔥 Most Upvoted</option>
          <option value="new">🕒 Newest First</option>
          <option value="old">⏳ Oldest First</option>
        </select>
      </div>
      <div id="steps-list"></div>
      <!-- [Keep the form here] -->
    </section>

    <!-- Tab 2: Short Theory -->
    <section id="tab-short_theory" class="tab-panel hidden">
      <div class="sort-bar">
        <select id="sort-short" onchange="loadSolutions('short_theory')">
          <option value="top">🔥 Most Upvoted</option>
          <option value="new">🕒 Newest First</option>
          <option value="old">⏳ Oldest First</option>
        </select>
      </div>
      <div id="short-list"></div>
      <!-- [Keep the form here] -->
      
      <div class="section-title" style="color: #a78bfa; margin-top: 3rem;">🎯 User Conclusions</div>
      <div id="conclusion-list"></div>
      <!-- [Keep the conclusion form here] -->
    </section>

    <!-- Tab 3: Full Theory -->
    <!-- [Keep the Full Theory section] -->

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
  
  <script>
    const qid = {{ qid }};
    const voterId = (() => {
      let id = localStorage.getItem('voter_id');
      if (!id) { id = crypto.randomUUID(); localStorage.setItem('voter_id', id); }
      return id;
    })();

    function escapeHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    
    // Generate consistent color from string
    function stringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
      return '#' + '00000'.substring(0, 6 - c.length) + c;
    }

    // Format content: Extract code blocks if surrounded by ``` and apply Prism
    function formatContent(text) {
      const parts = text.split(/(```[\s\S]*?```)/g);
      return parts.map(part => {
        if (part.startsWith('```')) {
          const match = part.match(/```(\w*)\n([\s\S]*?)```/);
          const lang = match && match[1] ? match[1] : 'python';
          const code = match ? match[2] : part.replace(/```/g, '');
          return `<pre><code class="language-${lang}">${escapeHtml(code)}</code></pre><button class="copy-btn" onclick="copyCode(this)">📋 Copy Code</button>`;
        }
        return `<div style="white-space:pre-wrap;">${escapeHtml(part)}</div>`;
      }).join('');
    }

    function copyCode(btn) {
      const code = btn.previousElementSibling.querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        const orig = btn.textContent; btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
      });
    }

    fetch('/api/questions/' + qid).then(r => r.json()).then(q => {
      document.getElementById('q-title').textContent = q.title;
      document.getElementById('full-theory').innerHTML = q.full_theory ? escapeHtml(q.full_theory) : '<span class="placeholder-text">Not added yet.</span>';
      document.getElementById('conclusion').innerHTML = q.conclusion ? escapeHtml(q.conclusion) : '<span class="placeholder-text">Not added yet.</span>';
    });

    function loadSolutions(type) {
      const sortVal = document.getElementById(type === 'steps' ? 'sort-steps' : (type === 'short_theory' ? 'sort-short' : 'top'))?.value || 'top';
      fetch(`/api/solutions/${qid}?type=${type}&sort=${sortVal}`).then(r => r.json()).then(list => {
        let boxId = type === 'steps' ? 'steps-list' : (type === 'short_theory' ? 'short-list' : 'conclusion-list');
        const box = document.getElementById(boxId);
        box.innerHTML = '';
        
        if (!list.length) {
          box.innerHTML = `<div class="empty-state">No ${type.replace('_', ' ')} submissions yet. Be the first! 🚀</div>`;
          return;
        }
        
        list.forEach(s => {
          const initial = s.user_name.charAt(0).toUpperCase();
          const color = stringToColor(s.user_name);
          const div = document.createElement('div');
          div.className = 'solution-card' + (type === 'conclusion' ? ' conclusion-card' : '');
          div.innerHTML = `
            <div class="sol-header">
              <div class="author-info">
                <div class="avatar" style="background:${color}">${initial}</div>
                <span class="sol-author">${escapeHtml(s.user_name)}</span>
              </div>
              <div style="display:flex; align-items:center; gap:.5rem;">
                <div class="sol-votes" id="vote-count-${s.id}">👍 ${s.votes}</div>
                <button class="flag-btn" onclick="flagSolution(${s.id}, this)" title="Report Spam">⚠️</button>
              </div>
            </div>
            <div class="sol-content">${formatContent(s.content)}</div>
            <button class="btn-upvote" onclick="upvote(${s.id}, this)">👍 Upvote</button>
          `;
          box.appendChild(div);
        });
        Prism.highlightAll(); // Re-run syntax highlighting
      });
    }

    function flagSolution(sid, btn) {
      if (!confirm('Report this solution as spam or inappropriate?')) return;
      fetch('/api/flag/' + sid, { method: 'POST' }).then(() => {
        btn.style.display = 'none';
        alert('Reported. An admin will review this.');
      });
    }

    function upvote(sid, btn) {
      btn.disabled = true; btn.innerHTML = '⏳';
      fetch('/api/upvote/' + sid, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({voter_id: voterId})
      }).then(r => r.json()).then(d => {
        if (d.votes !== undefined) {
          btn.innerHTML = '✅ Voted';
          document.getElementById('vote-count-' + sid).textContent = `👍 ${d.votes}`;
        } else {
          btn.innerHTML = '⚠️'; setTimeout(() => { btn.innerHTML = '👍 Upvote'; btn.disabled = false; }, 2000);
        }
      });
    }

    function submitSolution(type, btn) {
      let nameId = type === 'steps' ? 'steps-name' : (type === 'short_theory' ? 'short-name' : 'conclusion-name');
      let contentId = type === 'steps' ? 'steps-content' : (type === 'short_theory' ? 'short-content' : 'conclusion-content');
      
      const nameVal = document.getElementById(nameId).value.trim() || 'anonymous';
      const contentVal = document.getElementById(contentId).value.trim();
      if (!contentVal) return alert('Content required');

      btn.disabled = true; btn.innerHTML = '⏳ Submitting...';
      fetch('/api/solutions', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question_id: qid, type, content: contentVal, user_name: nameVal})
      }).then(r => r.json()).then(d => {
        btn.innerHTML = 'Submit'; btn.disabled = false;
        if (d.id) {
          document.getElementById(contentId).value = '';
          document.getElementById(nameId).value = '';
          loadSolutions(type);
        }
      });
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('tab-' + tab).classList.remove('hidden');
        if (tab === 'steps') loadSolutions('steps');
        if (tab === 'short_theory') { loadSolutions('short_theory'); loadSolutions('conclusion'); }
      };
    });

    loadSolutions('steps');
  </script>
</body>
</html>
