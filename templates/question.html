<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/" style="color:#c9d1d9; text-decoration:none; font-weight:600;">← Home</a>
    <nav><a href="/admin">🛠️ Admin</a></nav>
  </header>
  <main style="max-width: 850px;">
    <h1 id="q-title">Loading...</h1>

    <div class="tabs">
      <button class="tab active" data-tab="steps">🪜 Steps</button>
      <button class="tab" data-tab="short_theory">📘 Short Theory</button>
      <button class="tab" data-tab="full">📖 Full Theory</button>
    </div>

    <section id="tab-steps" class="tab-panel">
      <div id="steps-list"></div>
      <h3 style="margin-top:2rem; font-size:1.1rem;">Add your solution</h3>
      <input id="steps-name" placeholder="Your name (optional)">
      <textarea id="steps-content" rows="3" placeholder="Write the steps..."></textarea>
      <button onclick="submitSolution('steps', this)" class="btn-submit">Submit Solution</button>
    </section>

    <section id="tab-short_theory" class="tab-panel hidden">
      <div id="short-list"></div>
      <h3 style="margin-top:2rem; font-size:1.1rem;">Add short theory</h3>
      <input id="short-name" placeholder="Your name (optional)">
      <textarea id="short-content" rows="3" placeholder="Concise theory..."></textarea>
      <button onclick="submitSolution('short_theory', this)" class="btn-submit">Submit Theory</button>
    </section>

    <section id="tab-full" class="tab-panel hidden">
      <h2 style="margin-top:0; border:none; color:#f59e0b;">Full Prerequisite Theory</h2>
      <p id="full-theory" style="line-height:1.7; color:#c9d1d9; margin-bottom: 2rem;"></p>
      <h2 style="border:none; color:#f59e0b;">Conclusion</h2>
      <p id="conclusion" style="line-height:1.7; color:#c9d1d9;"></p>
    </section>
  </main>

  <script>
    const qid = {{ qid }};
    const voterId = (() => {
      let id = localStorage.getItem('voter_id');
      if (!id) { id = crypto.randomUUID(); localStorage.setItem('voter_id', id); }
      return id;
    })();

    fetch('/api/questions/' + qid).then(r => r.json()).then(q => {
      document.getElementById('q-title').textContent = q.title;
      document.getElementById('full-theory').textContent = q.full_theory || 'Not yet added.';
      document.getElementById('conclusion').textContent = q.conclusion || 'Not yet added.';
    });

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function loadSolutions(type) {
      fetch(`/api/solutions/${qid}?type=${type}`).then(r => r.json()).then(list => {
        const box = document.getElementById(type === 'steps' ? 'steps-list' : 'short-list');
        box.innerHTML = '';
        if (!list.length) {
          box.innerHTML = '<p style="color:#8b949e; font-style:italic;">No submissions yet. Be the first!</p>';
          return;
        }
        list.forEach(s => {
          const div = document.createElement('div');
          div.className = 'solution';
          div.innerHTML = `
            <div class="sol-head">
              <strong>👤 ${escapeHtml(s.user_name)}</strong>
              <span>👍 ${s.votes} votes</span>
            </div>
            <pre>${escapeHtml(s.content)}</pre>
            <button class="btn-upvote" onclick="upvote(${s.id}, this)">Upvote</button>
          `;
          box.appendChild(div);
        });
      });
    }

    function upvote(sid, btn) {
      btn.disabled = true; btn.textContent = 'Voting...';
      fetch('/api/upvote/' + sid, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({voter_id: voterId})
      }).then(r => r.json()).then(d => {
        if (d.votes !== undefined) {
          btn.textContent = '✅ Voted';
        } else {
          btn.textContent = '⚠️ ' + (d.error || 'Error');
          setTimeout(() => { btn.textContent = 'Upvote'; btn.disabled = false; }, 2000);
        }
      });
    }

    function submitSolution(type, btn) {
      const nameEl = document.getElementById(type === 'steps' ? 'steps-name' : 'short-name');
      const contEl = document.getElementById(type === 'steps' ? 'steps-content' : 'short-content');
      if (!contEl.value.trim()) return alert('Content required');
      
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Submitting...';
      
      fetch('/api/solutions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question_id: qid, type, content: contEl.value.trim(), user_name: nameEl.value.trim()})
      }).then(r => r.json()).then(d => {
        btn.textContent = orig; btn.disabled = false;
        if (d.id) { contEl.value = ''; nameEl.value = ''; loadSolutions(type); }
      });
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('tab-' + tab).classList.remove('hidden');
        if (tab === 'steps') loadSolutions('steps');
        if (tab === 'short_theory') loadSolutions('short_theory');
      };
    });

    loadSolutions('steps');
  </script>
</body>
</html>
