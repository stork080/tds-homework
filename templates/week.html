<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questions</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/" style="color:#c9d1d9; text-decoration:none; font-weight:600;">← Back to Home</a>
    <nav><a href="/admin">🛠️ Admin</a></nav>
  </header>
  <main style="max-width: 800px;">
    <h1 id="week-title" style="text-align: center; margin-bottom: 2rem;">Loading...</h1>
    <div id="q-list" style="display: flex; flex-direction: column; gap: 1rem;"></div>
  </main>
  <script>
    const weekId = {{ week_id }};
    fetch('/api/weeks/' + weekId).then(r => r.json()).then(w => {
      document.getElementById('week-title').textContent = w.name;
      const list = document.getElementById('q-list');
      
      if (!w.questions.length) {
        list.innerHTML = '<p style="text-align:center; color:#8b949e;">No questions in this week yet.</p>';
        return;
      }

      w.questions.forEach((q, i) => {
        const btn = document.createElement('a');
        btn.href = '/question/' + q.id;
        btn.className = 'btn-3d';
        btn.innerHTML = `
          <span><span class="q-num">Q${i+1}</span> ${q.title}</span>
          <span style="color:#58a6ff; font-size:1.5rem;">→</span>
        `;
        list.appendChild(btn);
      });
    });
  </script>
</body>
</html>
