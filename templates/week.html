<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Questions</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><a href="/">← Back</a></header>
  <main>
    <h1 id="week-title">Loading...</h1>
    <ul id="q-list" class="card-list"></ul>
  </main>
  <script>
    const weekId = {{ week_id }};
    fetch('/api/weeks/' + weekId).then(r => r.json()).then(w => {
      document.getElementById('week-title').textContent = w.name;
      const ul = document.getElementById('q-list');
      if (w.questions.length === 0) ul.innerHTML = '<li>No questions yet.</li>';
      w.questions.forEach(q => {
        const li = document.createElement('li');
        li.className = 'card';
        li.innerHTML = `<a href="/question/${q.id}">${q.title}</a>`;
        ul.appendChild(li);
      });
    });
  </script>
</body>
</html>
